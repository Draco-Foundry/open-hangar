<!doctype html>
<!--
  Scrubbed sample of RSI's /account/buy-back-pledges markup. Buy-backs are
  server-rendered <article> cards (same style as the hangar): name in <h1>, date
  and contained items in <dd> cells, and a `.holosmallbtn` reclaim button carrying
  data-pledgeid + href. No personal data. Selector shape mirrors
  SC-Open/hangarlink-hangarexport. See CONTRIBUTING.md.
-->
<html>
  <body>
    <div class="account-buyback">
      <article>
        <h1>Drake Cutlass Black</h1>
        <img src="https://media.robertsspaceindustries.com/abc/store_small.jpg" alt="" />
        <dl>
          <dt>Date</dt><dd>2023-11-24</dd>
          <dt>Pledge</dt><dd>Standalone Ship</dd>
          <dt>Items</dt><dd>Cutlass Black · Lifetime Insurance</dd>
          <dt>Status</dt><dd>Reclaimable</dd>
        </dl>
        <a class="holosmallbtn" href="/account/buy-back-pledges/reclaim/987654"
           data-pledgeid="987654" data-fromshipid="" data-toshipid="42" data-toskuid="99">Reclaim</a>
      </article>

      <!-- Two <dd> cells, and no data-pledgeid: id falls back to the reclaim URL -->
      <article>
        <h1>Aegis Avenger Titan</h1>
        <dl>
          <dt>Date</dt><dd>2022-05-01</dd>
          <dt>Items</dt><dd>Avenger Titan</dd>
        </dl>
        <a class="holosmallbtn" href="/account/buy-back-pledges/reclaim/123456">Reclaim</a>
      </article>
    </div>
  </body>
</html>
