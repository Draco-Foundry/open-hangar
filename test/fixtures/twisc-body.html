mPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResejNoX3cqkciemx3qLXVLZzq5LwAiHbNZ4))/85/shanora.webp&quot;,&quot;max&quot;:&quot;/i/bb6da8644fca070badde2168238c20fac48f3552/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResejNoX3cqkciemx3qLXVLZzq5LwAiHbNZ4/shanora.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;__typename&quot;:&quot;GenerateURIsResponseDto&quot;,&quot;placeholder&quot;:{&quot;desktop&quot;:&quot;/i/605f6103da88f7e41400ed879e98d1f9962f4ca6/resize(4,14,cover,crop(3670,1573,0,38,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResejNoX3cqkciemx3qLXVLZzq5LwAiHbNZ4))/shanora.webp&quot;,&quot;tablet&quot;:&quot;/i/69224530cf885dcb9261b497cfa2345d2857babe/resize(4,14,cover,crop(3670,1573,0,38,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResejNoX3cqkciemx3qLXVLZzq5LwAiHbNZ4))/85/shanora.webp&quot;,&quot;mobile&quot;:&quot;/i/82a046b68d4ee1cf51f549167c2975ce7c48ae39/resize(4,57,cover,crop(885,1573,0,1829,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResejNoX3cqkciemx3qLXVLZzq5LwAiHbNZ4))/85/shanora.webp&quot;,&quot;max&quot;:&quot;/i/bb6da8644fca070badde2168238c20fac48f3552/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResejNoX3cqkciemx3qLXVLZzq5LwAiHbNZ4/shanora.webp&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;alt&quot;:&quot;Shanora&quot;}" v-cloak=""></g-illustration><g-article :show-emphasis="false" body="<h4>xē'suelen nyahyan, hello everyone,</h4><p>Last week was a busy one on the testing front, with plenty of you jumping into both the Tech Preview and Alpha 4.10.2 PTU.</p><p>We put the latest <a href=&quot;https://robertsspaceindustries.com/spectrum/community/SC/forum/190049/thread/physicalized-entity-netcode-overhaul-tech-preview&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;><strong>Physicalized Entity Netcode</strong></a> overhaul through its paces, and we’ve been encouraged by the early response while also collecting plenty of notes for further improvements ahead of its release in an upcoming update. <a href=&quot;https://robertsspaceindustries.com/spectrum/community/SC/forum/4/thread/4-10-2-feedback-ship-ttk-balancing-update&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;><strong>Ship TTK balancing</strong></a> was also part of the weekend’s tests, and our teams are now digging through your feedback and data as we continue tuning the experience, including the AI modifier for PvE.</p><p>We also appreciate all the early feedback on <strong>Alpha 4.10.2’s </strong><a href=&quot;https://robertsspaceindustries.com/spectrum/community/SC/forum/4/thread/4-10-2-ptu-feedback-new-in-system-event&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;><strong>new in-system event</strong></a>. Testing will continue with additional PTU builds as we make further additions, address issues, and refine the experience based on what we’re seeing and hearing from you. As always, if you encounter a bug or have feedback to share, please keep it coming through the <a href=&quot;https://issue-council.robertsspaceindustries.com/projects/STAR-CITIZEN&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>Issue Council</a> and our dedicated Spectrum <a href=&quot;https://robertsspaceindustries.com/spectrum/community/SC/forum/4&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>feedback threads</a>. Thank you to everyone spending time testing with us!</p><p>If you missed the announcement last week, we’re introducing <a href=&quot;https://robertsspaceindustries.com/spectrum/community/SC/forum/3/thread/introducing-10-from-the-community&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;><strong><em>10 From the Community</em></strong></a>, a brand-new show debuting on October 5. Short, focused, and driven by your questions, each episode will tackle a different area of Star Citizen development. Head over to the announcement on Spectrum to submit your questions for the first episode, and don’t forget to vote for the ones you most want to see answered.</p><p>Finally this past weekend, we had an incredible time at <strong>Bar Citizen Porto</strong>, and it was fantastic to meet so many of you, swap stories, hear your feedback, and spend an evening together. Thank you to everyone who came out and made it a night to remember. Vamos!</p>" v-cloak=""></g-article><g-illustration image-size="fitContent" :simple-image="{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/616f4d7c78a933b5427ed338789693c48a4d326a/resize(3000,1286,cover,crop(3000,1286,293,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseAUUgN51HCE41jDkoXvQKKUTaV6cCVJkN))/bar-citizen-portugal-porto-2026-v3.jpg&quot;,&quot;tablet&quot;:&quot;/i/e897bec4b2024724dadc2c2efeaefd59f2e54a86/resize(1500,643,cover,crop(3000,1285,201,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseAUUgN51HCE41jDkoXvQKKUTaV6cCVJkN))/85/bar-citizen-portugal-porto-2026-v3.jpg&quot;,&quot;mobile&quot;:&quot;/i/c30c768f33565b5911082942e99aeeed1ab4ec16/resize(950,1688,cover,crop(950,1688,0,699,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseAUUgN51HCE41jDkoXvQKKUTaV6cCVJkN))/85/bar-citizen-portugal-porto-2026-v3.jpg&quot;,&quot;max&quot;:&quot;/i/d7144ee95eb376915c3d3ea4248b211befd252b2/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseAUUgN51HCE41jDkoXvQKKUTaV6cCVJkN/bar-citizen-portugal-porto-2026-v3.jpg&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/616f4d7c78a933b5427ed338789693c48a4d326a/resize(3000,1286,cover,crop(3000,1286,293,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseAUUgN51HCE41jDkoXvQKKUTaV6cCVJkN))/bar-citizen-portugal-porto-2026-v3.webp&quot;,&quot;tablet&quot;:&quot;/i/e897bec4b2024724dadc2c2efeaefd59f2e54a86/resize(1500,643,cover,crop(3000,1285,201,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjReseAUUgN51HCE41jDkoXvQKKUTaV6cCVJkN))/85/bar-citizen-portugal-porto-2026-v3.webp&quot;,&quot;mobile& lpha 4.10.2</strong> and the upcoming <strong>Tech Preview </strong>builds. It’ll be a quieter week on the comms front as our teams keep their heads down and focus on what’s ahead.</p><p>On <strong>Friday</strong>, the latest RSI Weekly Newsletter also lands in your inbox. If you’re not subscribed yet, you can sign up at any time through your <a href=&quot;https://robertsspaceindustries.com/account/settings&quot; rel=&quot;noopener noreferrer&quot; target=&quot;_blank&quot;>account settings</a>.</p><p>a.thl’ē’kol, see you soon.</p>" v-cloak=""></g-article><g-author author-link="https://x.com/NicouLenny" author-desc="Community Manager" author-name="Lénaïc &quot;Nicou&quot; Riédinger" :simple-image="{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/eed3ff627b0c2a80e0b354011002545f10f27c6a/resize(165,165,cover,crop(165,165,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjHYNAWknubHDfD452hzEL6hjHjeyvXgHC))/pp-nicou-cig-syulen.jpg&quot;,&quot;tablet&quot;:&quot;/i/376b2c2f61adaac29e342c27ee1d422222b582e2/resize(165,165,cover,crop(165,165,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjHYNAWknubHDfD452hzEL6hjHjeyvXgHC))/85/pp-nicou-cig-syulen.jpg&quot;,&quot;mobile&quot;:&quot;/i/376b2c2f61adaac29e342c27ee1d422222b582e2/resize(165,165,cover,crop(165,165,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjHYNAWknubHDfD452hzEL6hjHjeyvXgHC))/85/pp-nicou-cig-syulen.jpg&quot;,&quot;max&quot;:&quot;/i/6ed324367a3edc5e34926d49a29ff46cec6398d6/ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjHYNAWknubHDfD452hzEL6hjHjeyvXgHC/pp-nicou-cig-syulen.jpg&quot;,&quot;__typename&quot;:&quot;ImageURIs&quot;},&quot;webp&quot;:{&quot;desktop&quot;:&quot;/i/eed3ff627b0c2a80e0b354011002545f10f27c6a/resize(165,165,cover,crop(165,165,0,0,ADdPNihJzmPbNuTnFsH1DqUeqBRpXdSXVVtgJTyDDgscGKrzJuoFjResjHYNAWknubHDfD452hzEL6hjHjeyvXgHC))/pp-nicou-cig-syulen.webp&quot;,&quot;tablet&quot;:&quot;/i/376b2c2f61adaac29e342c27ee1d422222b582e2/resize(165,165,cover k&quot;>New Game Library System</a></li></ul><h4>FRIDAY,&nbsp;OCTOBER 2</h4><ul><li>RSI Weekly Newsletter</li></ul>" v-cloak=""></g-article></g-narrative-group><div data-arrangement_key="arrangementA" class="turbo-anchor" id="ab259a98" data-plugin_key="plugin_trblt_features" data-position="2"></div><g-features :background-options="{&quot;isTransparent&quot;:false}" arrangement="arrangementA" :is-image-action-declared="false" :is-header-declared="false" v-cloak=""><template slot="overline">Pilot</template><template slot="title">Vision quest truth</template><template slot="subtitle">Smuggling Origin 300</template><template slot="introduction"><p>We offer this World to the Galaxy as a place to study and a place to meet We offer this World to the Entity as a place to study and a place to meet Known locally as Pinecone, this Poisonous Main Sequence Dwarf is situated on the further edge of the green band and is often overlooked when compared to Kallis VI Damn right it is. Point is, no damn AI system's ever gonna be as good as an experienced Chief engineer</p><p>Known locally as The Hive, this High-pressure Coreless Planet is situated on the further edge of the green band and is often overlooked when compared to Kilian XIII "Maybe you should have a Engineer have a look at you.  Be sure." said Hester Polaris A further investigation of the planet revealed a cache of Kr'Thak weapons and war machines. "We don't have anythCore." Ernst said. The Being didn't like that answer.</p></template><g-feature :has-video="false" :cta-open-in-new-tab="false" arrangement="arrangementA" :is-image-action-declared="false" :picture="{&quot;originalFormat&quot;:{&quot;desktop&quot;:&quot;/i/87cfecd89bb25ff164961459780b80306767e27f/resize(1920,1080,cover,crop(1920,1080,0,0,FxX5caie56yqH8gB9R3Vx2D7fPeuJhsNBBCYyEqECtW8g66PN3VjncDXNjahLWMEoo4eqTggoHfjMtuQQm3i9FYeaiVGbqw3NpNp7rcCuaHt))/storytellers.jpg&quot;,&quot;tablet&quot;:&quot;/i/eba625c090a4de536362f42824128acaf2832468/resize(1500,643,cover,cr
