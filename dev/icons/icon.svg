<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Open Hangar (Dev): the logo in purple with a DEV tag, so a developer's build
       (npm run dev:chrome, dev:firefox) never passes for the public extension or the
       beta. Edit here, then regenerate the PNGs (the 16 and 32 px ones leave the tag
       out): node scripts/beta-icons.mjs dev -->
  <defs>
    <linearGradient id="oh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="oh-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2a8ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="oh-bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded panel background -->
  <rect x="3" y="3" width="122" height="122" rx="27" fill="url(#oh-bg)" stroke="#2a3139" stroke-width="2"/>

  <!-- glow rising from the open bay -->
  <path d="M40 101 V72 a24 24 0 0 1 48 0 V101 Z" fill="url(#oh-bay)"/>

  <!-- hangar shell: peaked roof + walls -->
  <path d="M22 101 V60 L64 28 L106 60 V101" fill="none" stroke="url(#oh-acc)"
        stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ship launching out of the bay -->
  <path d="M64 40 L80 90 L64 80 L48 90 Z" fill="#e6edf3"/>
  <path d="M64 40 L64 80 L48 90 Z" fill="#dccbf7"/>

  <!-- hangar floor -->
  <rect x="20" y="101" width="88" height="7" rx="3.5" fill="url(#oh-acc)"/>

  <!-- DEV tag (left out of the 16 and 32 px icons) -->
  <g id="dev-tag">
    <rect x="30" y="94" width="68" height="26" rx="13" fill="#a371f7" stroke="#0d1117" stroke-width="3"/>
    <text x="64" y="113" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="18" font-weight="700" letter-spacing="2" fill="#0d1117">DEV</text>
  </g>
</svg>
