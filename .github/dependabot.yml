# Keeps the commit-pinned GitHub Actions current (each pin carries its version in a
# comment, which Dependabot updates along with it). Only minor and patch updates
# arrive automatically: a new major version is upgraded on purpose and tested end to
# end, because PR CI doesn't run the publish, release and deploy workflows
# (Draco-Foundry/open-hangar#218). Security updates for npm packages come from
# Dependabot alerts, separately. Titles start "chore(deps):" so they pass CI's
# conventional-title check (docs/dev/git.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
  # npm packages, minor and patch only, as one weekly PR that CI tests (#191).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
