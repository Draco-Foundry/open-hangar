name: Release

# Push a tag like v0.2.8 (or run by hand with a tag) and this builds the Chrome
# and Firefox zips and publishes a GitHub Release with that version's
# CHANGELOG section as the notes. The tag must match manifest.json's version.
#
# A pushed tag (npm run release) then starts Publish to stores for it (store: all).
# That run waits for CI on the release commit, then for the owner's Approve on the
# 'stores' environment before anything is uploaded. A run by hand only rebuilds the
# GitHub Release: it never starts publishing (that could send an old tag).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.2.7'
        required: true

permissions:
  contents: write
  actions: write # to start Publish to stores for a pushed tag

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check the tag matches manifest.json
        run: |
          V=$(node -p "require('./manifest.json').version")
          if [ "$V" != "${{ steps.tag.outputs.version }}" ]; then
            echo "manifest.json is $V but the tag is ${{ steps.tag.outputs.tag }}"; exit 1
          fi
      - run: npm run pack
      # A store package never carries a dev build's staging site or the sync code.
      - run: node scripts/check-store-build.mjs
      - name: Release notes from CHANGELOG
        run: |
          V="${{ steps.tag.outputs.version }}"
          # Notes come from the tag's own CHANGELOG, so they describe exactly what
          # was released. Older tags may predate the file or its section: then main's.
          section() { awk -v v="$V" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' "$1"; }
          [ -f CHANGELOG.md ] && section CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            git fetch --depth=1 origin main
            git show FETCH_HEAD:CHANGELOG.md > CHANGELOG.main.md
            section CHANGELOG.main.md > notes.md
          fi
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          printf '\n---\n**Install:** [openhangar.space](https://openhangar.space/). The zips below are the exact store packages.\n' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          T="${{ steps.tag.outputs.tag }}"
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" dist/*.zip --clobber
            gh release edit "$T" --notes-file notes.md
          else
            gh release create "$T" dist/*.zip --title "Open Hangar ${{ steps.tag.outputs.version }}" --notes-file notes.md
          fi
      # One step: start publishing this tag to every store. Publish waits for CI on
      # the commit and for the owner's Approve (environment 'stores'), and keeps its
      # one-store-update-a-day check (npm run release x.y.z --hotfix ticks the Hotfix box).
      - name: Start Publish to stores
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # npm run release x.y.z --hotfix marks the tag's message: then the Hotfix
          # box (allow_second_today) is ticked for this run.
          HOTFIX=false
          OBJ=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${OBJ%% *}" = tag ]; then
            MSG=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${OBJ#* }" --jq .message)
            case "$MSG" in *"[hotfix]"*) HOTFIX=true ;; esac
          fi
          gh workflow run publish.yml -R "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f tag="$TAG" -f store=all -f allow_second_today="$HOTFIX"
          echo "::notice::Publish to stores started for $TAG (store: all, hotfix: $HOTFIX). Approve it in Actions once its checks pass."
