name: Deploy website

# The website (app/) and the daily stats Worker (stats-worker/), per
# docs/WEBSITE-PLAN.md → Backend Foundation step 3.
#
#  1. Staging: every push to main that touches them deploys to
#     staging.openhangar.space (its own database), migrations first.
#  2. Production: waits for the owner's approval (GitHub environment "production"),
#     exports both databases as a backup (kept 90 days as a run artifact), applies
#     migrations, then deploys the website and the stats Worker.
#  3. Discord #ops hears about a failure, and about each production deploy.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STAGING_BETTER_AUTH_SECRET,
# DISCORD_OPS_WEBHOOK. Production's own secrets live in Cloudflare, never here.

on:
  push:
    branches: [main]
    paths: ['app/**', 'stats-worker/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  staging:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The Cloudflare adapter bakes the wrangler environment in at build time.
      - run: npx astro build
        env:
          CLOUDFLARE_ENV: staging
      - name: Migrate the staging database
        run: npx wrangler d1 migrations apply open-hangar-staging --remote --env staging
      - name: Deploy to staging.openhangar.space
        run: npx wrangler deploy
      - name: Staging secrets
        env:
          SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
        run: echo "$SECRET" | npx wrangler secret put BETTER_AUTH_SECRET
      - name: Smoke test
        run: |
          for i in $(seq 1 18); do # a new domain can take a few minutes
            code=$(curl -s -o /dev/null -w '%{http_code}' https://staging.openhangar.space/api/health)
            [ "$code" = "200" ] && { echo "staging is up"; exit 0; }
            sleep 10
          done
          echo "staging answered $code"; exit 1

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production # waits for the owner's approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: app
      - run: npm ci
        working-directory: stats-worker
      - name: Back up both databases
        working-directory: app
        run: |
          mkdir -p ../backup
          npx wrangler d1 export open-hangar --remote --output ../backup/open-hangar.sql
          npx wrangler d1 export open-hangar-stats --remote --output ../backup/open-hangar-stats.sql
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
      - name: Build the website
        working-directory: app
        run: npx astro build
      - name: Migrate and deploy the website
        working-directory: app
        run: |
          npx wrangler d1 migrations apply open-hangar --remote
          npx wrangler deploy
      - name: Migrate and deploy the stats Worker
        working-directory: stats-worker
        run: |
          npx wrangler d1 migrations apply open-hangar-stats --remote
          npx wrangler deploy
      - name: Watchdog webhooks for the stats Worker
        working-directory: stats-worker
        env:
          OPS: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          STATUS: ${{ secrets.DISCORD_STATUS_WEBHOOK }}
        run: |
          echo "$OPS" | npx wrangler secret put DISCORD_OPS_WEBHOOK
          echo "$STATUS" | npx wrangler secret put DISCORD_STATUS_WEBHOOK
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://app.openhangar.space/api/health)
          [ "$code" = "200" ] || { echo "production answered $code"; exit 1; }

  notify:
    needs: [staging, production]
    if: always() && needs.staging.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post to #ops
        env:
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STAGING: ${{ needs.staging.result }}
          PROD: ${{ needs.production.result }}
        run: |
          if [ "$STAGING" = "failure" ] || [ "$PROD" = "failure" ]; then
            node scripts/notify.mjs ops --down "Deploy failed (staging: $STAGING, production: $PROD) $RUN"
          elif [ "$PROD" = "success" ]; then
            node scripts/notify.mjs ops --up "Website deployed to production. $RUN"
          fi
