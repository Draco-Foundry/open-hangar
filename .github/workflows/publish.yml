name: Publish to stores

# Uploads a released version to the extension stores. Run it by hand
# (Actions → Publish to stores → Run workflow) after the Release workflow has
# built that tag. Nothing here uploads on its own: publishing is always a choice.
#
# A single store is skipped (not failed) until its secrets exist; a full release
# (store: all) fails instead, so Discord never announces a store that got nothing:
#   Firefox: AMO_JWT_ISSUER, AMO_JWT_SECRET
#   Edge:    EDGE_PRODUCT_ID, EDGE_CLIENT_ID, EDGE_API_KEY
#   Chrome:  CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Discord: DISCORD_UPDATES_WEBHOOK (posts the release to #updates after "all")
# The store keys are environment secrets (environment 'stores'): each upload job
# waits for the owner to Approve it in the run before it can read them.
# Every store still reviews the upload before it goes live. Chrome refuses a new
# version while the last one is in review: that's a warning, rerun with store: chrome.
# store: discord only posts the announcement (e.g. after fixing a failed run).
#
# Before anything is uploaded, the build job checks the tag's commit passed CI on
# GitHub and runs the unit tests, the dashboard UI test and Firefox's store linter.
# One store update a day: a real run fails if another real run sent something to the
# stores in the last 24 hours. Finishing the same tag with one store (store: chrome
# after Chrome's "still in review") is fine; anything else needs the Hotfix box.
# Chrome goes to 100% once approved: staged rollout needs 10,000+ users (ROLLBACK.md).
# Dry run (the checkbox, and on every PR that touches publishing): everything but
# the uploads and posts. A PR's dry run publishes the latest released tag with the
# PR's tooling, exactly like a real run after the PR merges.
#
# The tag's code is what gets built; the scripts that publish it (scripts/publish,
# discord-post, notify) always come from this workflow's own commit, in .tools/,
# so an older tag never runs older or missing publishing code. Rolling back a bad version: docs/ROLLBACK.md.

# Manual runs are named "Publish <tag> to <store>" (plus " (dry run)"): the one-a-day
# check (scripts/publish/daily-gate.mjs) reads earlier runs' tag and store from it.
run-name: >-
  ${{ github.event_name == 'pull_request' && github.event.pull_request.title ||
  format('Publish {0} to {1}{2}', inputs.tag, inputs.store, inputs.dry_run && ' (dry run)' || '') }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.2.13'
        required: true
      store:
        description: 'Which store'
        type: choice
        options: [all, firefox, edge, chrome, discord]
        default: all
      dry_run:
        description: 'Dry run: build and check everything, upload nothing'
        type: boolean
        default: false
      allow_second_today:
        description: 'Hotfix: allow a second store update within 24h'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - scripts/publish/**
      - scripts/discord-post.mjs
      - scripts/notify.mjs
      - scripts/pack.mjs

permissions:
  contents: read
  actions: read # to check the tag's commit passed CI

env:
  STORE: ${{ github.event.inputs.store || 'all' }}
  DRY: ${{ github.event_name == 'pull_request' || github.event.inputs.dry_run == 'true' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Which tag
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then TAG=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName); fi
          echo "Publishing $TAG"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .tools
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - name: Only publish a commit that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .tools/scripts/publish/ci-gate.mjs
      # The owner's rule: at most one store update a day (#183). Dry runs and PRs skip it.
      - name: One store update a day
        if: env.DRY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.ref }}
          ALLOW: ${{ github.event.inputs.allow_second_today }}
        run: node .tools/scripts/publish/daily-gate.mjs
      - run: npm test
      # The real dashboard in Chrome, as CI runs it. Chrome on the runners now and
      # then fails to start, so a failed run gets one retry.
      - run: npm run test:ui || npm run test:ui
      # AMO's own checks, so a rejection shows up here and not in review.
      - run: npm run lint:firefox
      - name: Check the tag matches manifest.json
        id: v
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          V=$(node -p "require('./manifest.json').version")
          if ! node -e "import('./.tools/scripts/publish/lib.mjs').then(m => process.exit(m.tagMatches(process.argv[1], process.argv[2]) ? 0 : 1))" "$REF" "$V"; then
            echo "::error::manifest.json is $V but the tag is $REF"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm run pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            dist/*.zip
            dist/firefox/**

  firefox:
    needs: build
    if: github.event.inputs.store == 'firefox' || github.event.inputs.store == 'all' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Store keys live in the 'stores' environment, which waits for the owner's
    # Approve click before a real upload (#192). Dry runs skip it: no keys needed.
    environment: ${{ (github.event_name != 'pull_request' && !inputs.dry_run) && 'stores' || '' }}
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist
      - name: Submit to addons.mozilla.org
        run: |
          test -f dist/firefox/manifest.json
          if [ "$DRY" = true ]; then echo "::notice::Dry run: Firefox package ready, not uploaded"; exit 0; fi
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            if [ "$STORE" = all ]; then echo "::error::Firefox: AMO secrets not set, so a full release can't reach Firefox"; exit 1; fi
            echo "::notice::Firefox skipped: AMO secrets not set"; exit 0
          fi
          npm install --no-save web-ext@10.7.0 # pinned: this step holds the AMO keys
          # The Svelte pages (ui/) are compiled by Vite, so AMO needs the source
          # and build steps: attach this exact commit's source (docs/AMO-SOURCE.md
          # explains how to rebuild it).
          git archive --format=zip -o "$RUNNER_TEMP/open-hangar-source.zip" HEAD
          # Listed channel = the public AMO page. Don't wait for Mozilla's review.
          npx web-ext sign --channel=listed --source-dir dist/firefox \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code "$RUNNER_TEMP/open-hangar-source.zip" \
            --approval-timeout 0

  edge:
    needs: build
    if: github.event.inputs.store == 'edge' || github.event.inputs.store == 'all' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Store keys live in the 'stores' environment, which waits for the owner's
    # Approve click before a real upload (#192). Dry runs skip it: no keys needed.
    environment: ${{ (github.event_name != 'pull_request' && !inputs.dry_run) && 'stores' || '' }}
    env:
      PRODUCT: ${{ secrets.EDGE_PRODUCT_ID }}
      CLIENT: ${{ secrets.EDGE_CLIENT_ID }}
      KEY: ${{ secrets.EDGE_API_KEY }}
      VERSION: ${{ needs.build.outputs.version }}
      # The tag's CHANGELOG (not main's), so the notes match what shipped.
      NOTES: 'Open Hangar ${{ needs.build.outputs.version }}. Changes: https://github.com/${{ github.repository }}/blob/${{ needs.build.outputs.ref }}/CHANGELOG.md'
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist
      - name: Submit to Edge Add-ons
        run: |
          ZIP="dist/open-hangar-chrome-$VERSION.zip"
          test -f "$ZIP"
          if [ "$DRY" = true ]; then echo "::notice::Dry run: Edge package $ZIP ready, not uploaded"; exit 0; fi
          if [ -z "$PRODUCT" ] || [ -z "$CLIENT" ] || [ -z "$KEY" ]; then
            if [ "$STORE" = all ]; then echo "::error::Edge: Edge secrets not set, so a full release can't reach Edge"; exit 1; fi
            echo "::notice::Edge skipped: Edge secrets not set"; exit 0
          fi
          API="https://api.addons.microsoftedge.microsoft.com/v1/products/$PRODUCT/submissions"
          H=(-H "Authorization: ApiKey $KEY" -H "X-ClientID: $CLIENT")
          # 1) upload the package to the draft, 2) wait for it, 3) submit.
          OP=$(curl -sS -D - -o /dev/null "${H[@]}" -H "Content-Type: application/zip" \
            -X POST "$API/draft/package" --data-binary "@$ZIP" \
            | awk -F': ' 'tolower($1)=="location"{print $2}' | tr -d '\r')
          [ -n "$OP" ] || { echo "::error::Edge didn't accept the upload"; exit 1; }
          for _ in $(seq 1 30); do
            R=$(curl -sS "${H[@]}" "$API/draft/package/operations/$OP")
            S=$(echo "$R" | jq -r .status)
            echo "upload: $S"
            [ "$S" = "Succeeded" ] && break
            [ "$S" = "Failed" ] && { echo "$R"; echo "::error::Edge rejected the package (details above)"; exit 1; }
            sleep 10
          done
          [ "$S" = "Succeeded" ] || { echo "::error::Edge upload still processing, check Partner Center"; exit 1; }
          curl -sS -f "${H[@]}" -H "Content-Type: application/json" -X POST "$API" \
            -d "$(jq -n --arg n "$NOTES" '{notes: $n}')"

  chrome:
    needs: build
    if: github.event.inputs.store == 'chrome' || github.event.inputs.store == 'all' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Store keys live in the 'stores' environment, which waits for the owner's
    # Approve click before a real upload (#192). Dry runs skip it: no keys needed.
    environment: ${{ (github.event_name != 'pull_request' && !inputs.dry_run) && 'stores' || '' }}
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .tools
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: dist
      - name: Submit to the Chrome Web Store
        run: |
          ZIP="dist/open-hangar-chrome-$VERSION.zip"
          test -f "$ZIP"
          if [ "$DRY" = true ]; then echo "::notice::Dry run: Chrome package $ZIP ready, not uploaded"; exit 0; fi
          if [ -z "$EXTENSION_ID" ] || [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            if [ "$STORE" = all ]; then echo "::error::Chrome: Chrome Web Store secrets not set, so a full release can't reach Chrome"; exit 1; fi
            echo "::notice::Chrome skipped: Chrome Web Store secrets not set"; exit 0
          fi
          # Upload, then submit for review (publishes once Google approves).
          node .tools/scripts/publish/chrome.mjs "$ZIP"

  # Tell the Discord #updates channel, once every store upload went through: after
  # a full release (store: all), or on its own with store: discord. Skipped until
  # DISCORD_UPDATES_WEBHOOK is set. A dry run prints the message instead.
  discord:
    needs: [build, firefox, edge, chrome]
    if: >
      !cancelled() && !failure() &&
      (github.event.inputs.store == 'all' || github.event.inputs.store == 'discord' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    env:
      DISCORD_UPDATES_WEBHOOK: ${{ secrets.DISCORD_UPDATES_WEBHOOK }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .tools
          sparse-checkout: scripts
      # The post is the tag's own CHANGELOG section, so it describes what shipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.ref }}
          path: tag
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Post the release to Discord
        run: |
          if [ "$DRY" = true ]; then node .tools/scripts/discord-post.mjs "$VERSION" --changelog=tag/CHANGELOG.md --dry-run; exit 0; fi
          node .tools/scripts/discord-post.mjs "$VERSION" --changelog=tag/CHANGELOG.md

  # Something failed: tell #ops (private) which part. Skipped until DISCORD_OPS_WEBHOOK
  # is set, and on dry runs.
  ops:
    needs: [build, firefox, edge, chrome, discord]
    if: failure() && github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .tools
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Post to #ops
        env:
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          RESULTS: >-
            Checks: ${{ needs.build.result }} · Firefox: ${{ needs.firefox.result }} ·
            Edge: ${{ needs.edge.result }} · Chrome: ${{ needs.chrome.result }} ·
            Discord: ${{ needs.discord.result }}
          REF: ${{ needs.build.outputs.ref || github.event.inputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .tools/scripts/notify.mjs ops --down "Publishing $REF ($STORE) had a failure. $RESULTS $RUN"
