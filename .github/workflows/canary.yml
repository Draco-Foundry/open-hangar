name: RSI canary

# Once a day, download RSI's public pages the extension reads and run its real
# parsers on them (scripts/canary.mjs). If RSI changed something, #ops hears
# about it before users do. Playbook: docs/RSI-CHANGES.md.

on:
  schedule:
    - cron: '41 7 * * *' # daily 07:41 UTC
  workflow_dispatch:
  pull_request:
    paths: ['scripts/canary.mjs', '.github/workflows/canary.yml']

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check RSI's public sources
        env:
          CANARY_REPORT: ${{ runner.temp }}/canary.md
        run: node scripts/canary.mjs
      - name: Post to #ops
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          REPORT: ${{ runner.temp }}/canary.md
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(cat "$REPORT" 2>/dev/null || echo "The canary crashed before writing a report.")
          # One titled card; a long report is cut at 4,000 with the run link (notify.mjs).
          node scripts/notify.mjs ops --down --title="RSI Canary Failed" --footer=Canary --run="$RUN" "$body"
