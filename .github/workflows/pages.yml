name: Pages

on:
  push:
    branches: [main]
    paths:
      [
        'site/**',
        'icons/icon.svg',
        'src/assets/banner.svg',
        'manifest.json',
        'docs/store-assets/screenshot-*',
        '.github/workflows/pages.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to date the last version bump below
      # Reuse the extension's own art rather than keeping copies in site/.
      - run: cp icons/icon.svg src/assets/banner.svg site/
      # Screenshot tour images: same files as the store listings (npm run screenshots).
      - run: mkdir -p site/img/screens && cp docs/store-assets/screenshot-*.jpg site/img/screens/
      # Stamp the current version and its release date into the landing page, so
      # the site can never show a stale version. "Updated" = the last commit that
      # changed manifest.json's version line.
      - name: Stamp version + release date
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          ISO=$(git log -1 --format=%cs -G'"version"' -- manifest.json)
          HUMAN=$(date -u -d "$ISO" '+%b %-d, %Y')
          sed -i -E \
            -e "s#(<strong data-version>)[^<]*(</strong>)#\1${VERSION}\2#" \
            -e "s#(<time data-updated datetime=\")[^\"]*(\">)[^<]*(</time>)#\1${ISO}\2${HUMAN}\3#" \
            site/index.html
          grep -E 'data-version|data-updated' site/index.html
          echo "Stamped v${VERSION}, updated ${HUMAN}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # What actions/upload-pages-artifact does, with its inner upload pinned too.
      - name: Archive the site
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2 (Pages needs v4)
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
