name: Pages

on:
  push:
    branches: [main]
    paths:
      [
        'site/**',
        'site-worker/**',
        'icons/icon.svg',
        'src/assets/banner.svg',
        'manifest.json',
        'docs/store-assets/screenshot-*',
        '.github/workflows/pages.yml',
        'scripts/update-rates.mjs',
      ]
  # Hourly (owner, 2026-10-06): the extension page's store versions keep up. Every
  # 3 hours always, and every hour while a store has a version in review, so
  # "approved and live" shows soon after a store finishes (the gate step below).
  # 15:30 UTC is one of the 3-hour runs: after the ECB publishes (about 16:00 CET
  # on working days), so rates.json stays fresh too.
  schedule:
    - cron: '30 * * * *'
  # Right after a store publish, so "in review" appears within minutes.
  workflow_run:
    workflows: ['Publish to stores']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # store-versions.mjs reads Publish to stores runs

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  # Hourly runs only go ahead every 3 hours, or when a store has a version in review
  # (read from the live versions.json). Pushes, publishes and manual runs always go.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - name: Is this hour worth a run?
        id: gate
        run: |
          go=yes
          if [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date -u +%-H) % 3 )) -ne 0 ]; then
            pending=$(curl -fsS --max-time 15 https://openhangar.space/versions.json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const v=JSON.parse(s);console.log(Object.values(v.stores||{}).some(x=>x&&x.pending)?'yes':'no')}catch{console.log('yes')}})" \
              || echo yes)
            [ "$pending" = "yes" ] || go=no
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Run this hour: $go"
  deploy:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, to date the last version bump below
      # Reuse the extension's own art rather than keeping copies in site/.
      - run: cp icons/icon.svg src/assets/banner.svg site/
      # Screenshot tour images: same files as the store listings (npm run screenshots).
      - run: mkdir -p site/img/screens && cp docs/store-assets/screenshot-*.jpg site/img/screens/
      # Stamp the current version and its release date into the landing page, so
      # the site can never show a stale version. "Updated" = the last commit that
      # changed manifest.json's version line.
      - name: Stamp version + release date
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          ISO=$(git log -1 --format=%cs -G'"version"' -- manifest.json)
          HUMAN=$(date -u -d "$ISO" '+%b %-d, %Y')
          sed -i -E \
            -e "s#(<strong data-version>)[^<]*(</strong>)#\1${VERSION}\2#" \
            -e "s#(<time data-updated datetime=\")[^\"]*(\">)[^<]*(</time>)#\1${ISO}\2${HUMAN}\3#" \
            site/index.html
          grep -E 'data-version|data-updated' site/index.html
          echo "Stamped v${VERSION}, updated ${HUMAN}"
      # Each install button's live store version, and a newer one in review. A store
      # that can't be read is left blank; this step never stops the deploy.
      - name: Stamp store versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish/store-versions.mjs site/index.html
      # The extension's exchange rates (#243): built here, never committed.
      - run: node scripts/update-rates.mjs site/rates.json
      # openhangar.space is served by Cloudflare (site-worker/, open-hangar#201;
      # GitHub Pages was turned off 2026-10-01).
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.143.0 deploy --config site-worker/wrangler.jsonc
