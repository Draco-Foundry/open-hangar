name: Ship catalog

# Weekly refresh of src/data/ship-catalog.json (ship prices and stats bundled
# with the extension). Commits to main only when the list changed; the next
# release picks it up.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-ship-catalog.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/ship-catalog.json; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ship-catalog.json
          git commit -m "data: weekly ship catalog refresh"
          git push
