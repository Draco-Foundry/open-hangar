name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      # Click through the real dashboard with the demo account (Chrome is
      # preinstalled on GitHub's Ubuntu runners).
      - run: npm run test:ui
      # The exact store zips, through Firefox's store linter, so a dependency bump
      # that breaks packaging fails here and not on release day.
      - run: npm run pack
      - run: npx web-ext lint --source-dir dist/firefox
      # The public zips: sync built in to production only, no staging site, no beta name.
      - run: npm run check:store
      # The unlisted Open Hangar Beta (docs/BETA.md): synced to production, never
      # staging. build:beta checks its own zips (check-store-build.mjs --beta).
      - run: npm run build:beta
      # Its Firefox build is self-distributed, so its update_url is allowed.
      - run: npx web-ext lint --self-hosted --source-dir dist/beta-firefox

  # Every workflow file checked, so a typo fails the PR instead of a release (#235).
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/actionlint.sh

  # Tell #ops (private Discord channel) when main goes red. Skipped until the
  # DISCORD_OPS_WEBHOOK secret is set.
  notify:
    needs: [test, workflows]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Post to #ops
        env:
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          # Through env, never pasted into the script: a commit message is untrusted.
          MSG: ${{ github.event.head_commit.message || github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/notify.mjs ops --down "CI failed on main: $MSG $RUN"
