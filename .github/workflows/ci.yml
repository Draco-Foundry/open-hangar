name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run format:check
      # Click through the real dashboard with the demo account (Chrome is
      # preinstalled on GitHub's Ubuntu runners).
      - run: npm run test:ui

  # Tell #ops (private Discord channel) when main goes red. Skipped until the
  # DISCORD_OPS_WEBHOOK secret is set.
  notify:
    needs: [test]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Post to #ops
        env:
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
        run: >
          node scripts/notify.mjs ops --down
          "CI failed on main: ${{ github.event.head_commit.message || github.sha }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
