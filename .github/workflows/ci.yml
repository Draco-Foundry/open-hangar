name: CI

# One run per change: a push to main runs on push, everything else runs as a pull
# request (any base, so PRs into redesign/0.3-svelte too). Release tags need no
# run of their own: the tag's commit is main's, and publish.yml waits for CI on it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on a PR cancels the PR's older run. Runs on main never cancel or
# queue behind each other (each gets its own group): publish.yml waits for CI on
# the release commit, so that run must always finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read # to list a PR's changed files (docs-only check)

jobs:
  # Branch protection requires this job by name ("test"): keep the name, and keep
  # it reporting success on docs-only PRs (the slow steps skip, the job still runs).
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PR rules (docs/dev/git.md): the title is a conventional commit (the squash
      # commit takes it), and no branch plan in docs/plans/ is left behind.
      - name: PR rules
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          ok=true
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR title must be a conventional commit, like 'fix(store): …' (docs/dev/git.md)"
            ok=false
          fi
          plans=$(git ls-tree -r --name-only HEAD docs/plans | grep -v '^docs/plans/README.md$' || true)
          if [ -n "$plans" ]; then
            echo "::error::Delete the branch plan before merging: $plans"
            ok=false
          fi
          $ok
      # Docs-only PRs (Markdown, docs/, the landing page in site/, issue templates)
      # skip the slow UI test and the store packaging; the fast checks still run.
      # When in doubt (not a PR, or the file list can't be read) everything runs.
      - name: What changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          if [ -n "$PR" ] && files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "$files"
            code=$(echo "$files" | grep -vE '\.md$|^docs/|^site/|^\.github/ISSUE_TEMPLATE/' || true)
            if [ -n "$files" ] && [ -z "$code" ]; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          if [ "$docs_only" = true ]; then
            echo "::notice::Docs-only change: the UI test and store packaging are skipped"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      # Click through the real dashboard with the demo account (Chrome is
      # preinstalled on GitHub's Ubuntu runners).
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:ui
      # The exact store zips, through Firefox's store linter, so a dependency bump
      # that breaks packaging fails here and not on release day.
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run pack
      - if: steps.changes.outputs.docs_only != 'true'
        run: npx web-ext lint --source-dir dist/firefox
      # The public zips: sync built in to production only, no staging site, no beta name.
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:store
      # The Chrome store build in Chrome, never connected: nothing to the sync site and
      # only plain reads of the public feeds (scripts/privacy-check.mjs).
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:privacy
      # The unlisted Open Hangar Beta (docs/BETA.md): synced to production, never
      # staging. build:beta checks its own zips (check-store-build.mjs --beta).
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run build:beta
      # Its Firefox build is self-distributed, so its update_url is allowed.
      - if: steps.changes.outputs.docs_only != 'true'
        run: npx web-ext lint --self-hosted --source-dir dist/beta-firefox

  # Every workflow file checked, so a typo fails the PR instead of a release (#235).
  workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/actionlint.sh

  # Tell #ops (private Discord channel) when main goes red. Skipped until the
  # DISCORD_OPS_WEBHOOK secret is set.
  notify:
    needs: [test, workflows]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Post to #ops
        env:
          DISCORD_OPS_WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK }}
          # Through env, never pasted into the script: a commit message is untrusted.
          MSG: ${{ github.event.head_commit.message || github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/notify.mjs ops --down "CI failed on main: $MSG $RUN"
