name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run format:check
      # Click through the real dashboard with the demo account (Chrome is
      # preinstalled on GitHub's Ubuntu runners).
      - run: npm run test:ui
