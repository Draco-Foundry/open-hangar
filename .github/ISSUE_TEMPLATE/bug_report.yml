name: 🐞 Bug report
description: Something in Open Hangar isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **don't paste personal data** (referral codes, emails, order numbers) — screenshots are fine if you crop them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Hangar version
      description: Shown at the bottom of the dashboard (e.g. v0.2.7).
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Firefox, Brave, Other]
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Error report
      description: In Open Hangar, go to Developers → Copy error report and paste it here. It has no personal info.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, which page (Inventory, Buy-Backs, Stats…), roughly how many pledges you have.
