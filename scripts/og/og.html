<!doctype html>
<!-- The link preview (site/img/og.jpg, 1200×630) that Reddit, Discord and Spectrum show.
     Real UI only, no AI art: the logo, the name, and the Home screenshot of the fictional
     demo account. Rendered by scripts/og/render.mjs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e6edf3;
        background:
          radial-gradient(ellipse 60% 90% at 85% 50%, rgba(47, 129, 247, 0.22), transparent 70%),
          linear-gradient(160deg, #070b18, #05070f 60%);
        position: relative;
      }
      .left {
        position: absolute;
        left: 64px;
        top: 0;
        bottom: 0;
        width: 440px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .left img {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 0 24px rgba(47, 129, 247, 0.45));
      }
      h1 {
        margin-top: 28px;
        font: 800 84px/0.95 'Segoe UI', system-ui, sans-serif;
        letter-spacing: 0.04em;
      }
      .rule {
        margin: 28px 0 22px;
        height: 3px;
        width: 100%;
        background: linear-gradient(90deg, #2f81f7, rgba(47, 129, 247, 0));
      }
      p {
        font: 600 30px/1.3 'Segoe UI', system-ui, sans-serif;
      }
      small {
        display: block;
        margin-top: 18px;
        font-size: 22px;
        color: #8b949e;
      }
      .shot {
        position: absolute;
        left: 560px;
        top: 70px;
        width: 800px;
        border-radius: 14px;
        border: 1px solid #2a3139;
        box-shadow:
          0 30px 80px rgba(0, 0, 0, 0.6),
          0 0 0 6px rgba(47, 129, 247, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="left">
      <img src="../../site/icon.svg" alt="" />
      <h1>OPEN<br />HANGAR</h1>
      <div class="rule"></div>
      <p>Your Star Citizen hangar,<br />in one clean dashboard.</p>
      <small>Free · Source available · openhangar.space</small>
    </div>
    <img class="shot" src="../../docs/store-assets/screenshot-2-home.png" alt="" />
  </body>
</html>
